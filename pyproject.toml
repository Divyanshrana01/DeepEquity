[project]
name = "deepequity"
version = "0.1.0"
description = "Multi-agent equity research desk: bull/bear agents debate a thesis, a synthesis agent produces a cited research note."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.10",
    "structlog>=24.4",
    "mcp>=1.12",
    "httpx>=0.27",
    "yfinance>=0.2.50",
    "psycopg-pool>=3.2",
    "fastembed>=0.8.0",
    "selectolax>=0.4.11",
    "groq>=1.6.0",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-redis>=0.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "fakeredis>=2.26",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepequity", "mcp_server"]
# these aren't .py files, so hatchling would skip them without this. the prompts are
# real artefacts the agents load at runtime, not documentation.
artifacts = [
    "src/deepequity/db/*.sql",
    "src/deepequity/prompts/library/*.md",
    "src/deepequity/api/static/*.html",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
