services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: deepequity
      POSTGRES_PASSWORD: deepequity
      POSTGRES_DB: deepequity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepequity"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # redis-stack rather than plain redis, because the langgraph checkpointer stores its
    # state as JSON documents and queries them with RediSearch. On plain redis those
    # commands don't exist, checkpointing silently falls back to in-memory, and runs stop
    # being resumable without anything obviously breaking.
    image: redis/redis-stack-server:7.2.0-v11
    ports:
      - "6379:6379"
    # Write to disk, and keep the disk between container rebuilds.
    #
    # Redis holds two things worth keeping: the semantic cache and the langgraph
    # checkpoints. Without a volume, `docker compose up --build` quietly takes both with
    # it. Caught doing exactly that: a warmed cache went back to zero hits after a
    # rebuild, and it looked like a caching bug rather than a missing volume. Losing the
    # checkpoints is the worse half, since resumability is the whole reason they exist.
    command: redis-stack-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://deepequity:deepequity@postgres:5432/deepequity
      REDIS_URL: redis://redis:6379/0
      MCP_SERVER_URL: http://mcp-server:8000/mcp
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["python", "-m", "deepequity.worker.main"]
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://deepequity:deepequity@postgres:5432/deepequity
      REDIS_URL: redis://redis:6379/0
      MCP_SERVER_URL: http://mcp-server:8000/mcp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_started

  mcp-server:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["uvicorn", "mcp_server.server:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      SEC_USER_AGENT: ${SEC_USER_AGENT:-DeepEquity research divyanshr141@gmail.com}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
    ports:
      - "8001:8000"

volumes:
  postgres_data:
  redis_data:
